name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Glob, not a directory: Node 24 doesn't expand `node --test tests/`.
      # Desktop-only theme/menu fixtures skip when the source is unavailable.
      - name: Unit tests
        run: node --test tests/*.test.js

      - name: Shell syntax
        run: |
          for script in bin/kay-cast bin/kay-cast-desktop bin/kay-cast-launch tests/smoke.sh; do
            bash -n "$script"
          done
          python3 -c 'import ast, pathlib; ast.parse(pathlib.Path("bin/kay-cast-hyprland.py").read_text())'

      - name: Plugin manifest is valid JSON
        run: node -e 'JSON.parse(require("fs").readFileSync("plugin/manifest.json", "utf8"))'
